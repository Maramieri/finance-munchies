<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Finance Munchies · Giochi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;800;900&family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@400;600;700&display=swap">
<style>
/* Layout: colonna unica da quotidiano, larghezza di lettura; i tre giochi in sequenza, punteggio in fondo */
:root{
  --paper:#fbf8f1; --ink:#141414; --muted:#5b5b5b; --rule:#141414; --soft:#d9d4c7; --band:#efe9dc;
  --accent:#9e1b1b; --ok:#13703a; --ko:#b3261e; --cell:#ffffff; --okbg:#e3f1e7; --kobg:#f8e3e1;
  --display:"Playfair Display",Georgia,"Times New Roman",serif;
  --body:"Source Serif 4",Georgia,"Times New Roman",serif;
  --ui:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#16140f; --ink:#ece6d8; --muted:#a59d8c; --rule:#ece6d8; --soft:#3b372e; --band:#221f18;
  --accent:#e0675c; --ok:#5fc27f; --ko:#ef7a6f; --cell:#211e17; --okbg:#1d3324; --kobg:#3a201d; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#16140f; --ink:#ece6d8; --muted:#a59d8c; --rule:#ece6d8; --soft:#3b372e; --band:#221f18;
  --accent:#e0675c; --ok:#5fc27f; --ko:#ef7a6f; --cell:#211e17; --okbg:#1d3324; --kobg:#3a201d; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45}
.wrap{max-width:760px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-family:var(--ui);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--rule);padding-bottom:6px}
.top select{font:inherit;text-transform:none;letter-spacing:0;color:var(--ink);background:var(--cell);border:1px solid var(--soft);border-radius:4px;padding:3px 6px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(34px,8vw,52px);line-height:1;margin:14px 0 4px;text-align:center;letter-spacing:-.01em}
h1 b{font-weight:900;font-size:1.16em}
.sub{text-align:center;font-style:italic;color:var(--muted);margin:0 0 6px}
.dateline{border-top:3px solid var(--rule);border-bottom:1px solid var(--rule);padding:5px 0;font-family:var(--ui);font-size:12px;letter-spacing:.05em;text-transform:uppercase;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
section.game{margin-top:28px}
.kicker{font-family:var(--ui);font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--accent)}
h2{font-family:var(--display);font-weight:800;font-size:28px;line-height:1.1;margin:2px 0 6px;text-wrap:balance}
h2 .hl{color:var(--accent)}
.note{font-style:italic;color:var(--muted);font-size:15px;margin:0 0 12px}
.q{border-top:1px solid var(--soft);padding:12px 0}
.q p{margin:0 0 8px}
.q p b{font-family:var(--ui)}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{position:relative}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt label{display:inline-flex;align-items:center;gap:8px;font-family:var(--ui);font-size:15px;border:1px solid var(--soft);background:var(--cell);border-radius:6px;padding:7px 12px;cursor:pointer;min-height:40px}
.opt label .k{font-weight:700}
.opt input:checked + label{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.opt input:focus-visible + label{outline:2px solid var(--accent);outline-offset:2px}
.q.ok .opt input:checked + label{background:var(--okbg);border-color:var(--ok);box-shadow:inset 0 0 0 1px var(--ok)}
.q.ko .opt input:checked + label{background:var(--kobg);border-color:var(--ko);box-shadow:inset 0 0 0 1px var(--ko)}
.q.show .opt.right label{border-color:var(--ok);border-style:dashed}
.why{display:none;font-size:15px;margin-top:8px;padding:8px 10px;background:var(--band);border-left:3px solid var(--muted)}
.q.show .why{display:block}
.q.ok .why{border-left-color:var(--ok)} .q.ko .why{border-left-color:var(--ko)}
.why b{font-family:var(--ui)}
/* cruciverba */
.cw-scroll{overflow-x:auto;padding-bottom:4px}
table.cw{border-collapse:collapse;margin:4px 0 14px}
table.cw td{width:30px;height:30px;padding:0;position:relative}
table.cw td.c{border:1.5px solid var(--ink);background:var(--cell)}
table.cw td i{position:absolute;top:1px;left:2px;font-style:normal;font-family:var(--ui);font-size:9px;line-height:1;color:var(--muted);pointer-events:none}
table.cw input{width:100%;height:100%;border:0;background:transparent;text-align:center;font-family:var(--ui);font-weight:700;font-size:16px;text-transform:uppercase;color:var(--ink);padding:4px 0 0;caret-color:var(--accent)}
table.cw input:focus{outline:none;background:var(--band)}
table.cw td.hiw{background:var(--band)}
table.cw td.good input{color:var(--ok)} table.cw td.bad{background:var(--kobg)}
@media (max-width:520px){table.cw td{width:22px;height:22px} table.cw input{font-size:13px;padding-top:3px} table.cw td i{font-size:7px}}
.defs{display:grid;grid-template-columns:1fr 1fr;gap:6px 24px;font-size:15px}
.defs h3{font-family:var(--ui);font-size:12px;letter-spacing:.08em;text-transform:uppercase;margin:0 0 4px;border-bottom:1px solid var(--rule);padding-bottom:2px}
.defs p{margin:0 0 3px}
.defs .len{font-family:var(--ui);font-size:12px;color:var(--muted)}
.defs p.cur{background:var(--band)}
@media (max-width:620px){.defs{grid-template-columns:1fr}}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
button{font-family:var(--ui);font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:10px 18px;cursor:pointer;border:1.5px solid var(--ink);background:var(--cell);color:var(--ink)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.cwmsg{font-family:var(--ui);font-size:14px;color:var(--muted);margin-top:8px;min-height:1.2em}
/* punteggio */
.score{margin-top:32px;border-top:3px solid var(--rule);background:var(--band);padding:16px}
.score h2{margin-top:0}
.bars{display:grid;gap:10px;margin:12px 0}
.bar{display:grid;grid-template-columns:96px 1fr 120px;gap:10px;align-items:center;font-family:var(--ui);font-size:14px}
.bar .track{height:12px;background:var(--cell);border:1px solid var(--soft);position:relative}
.bar .fill{position:absolute;inset:0 auto 0 0;background:var(--accent);width:0;transition:width .5s ease}
.bar .v{text-align:right;font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.bar.tot{font-size:15px} .bar.tot .track{height:16px} .bar.tot .fill{background:var(--ink)}
@media (max-width:480px){.bar{grid-template-columns:72px 1fr auto;gap:8px;font-size:13px}.bar.tot{font-size:14px}}
.verdict{font-family:var(--display);font-weight:900;font-size:26px;margin:6px 0 2px}
.bands{font-family:var(--ui);font-size:13px;color:var(--muted);margin:8px 0 0;display:grid;gap:2px}
.bands span b{color:var(--ink)}
.bands .on{color:var(--ink);font-weight:700}
.small{font-size:14px;color:var(--muted);font-style:italic}
.err{background:var(--kobg);padding:12px;border-left:3px solid var(--ko)}
@media (prefers-reduced-motion: reduce){.bar .fill{transition:none}}
</style>
<style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>
<div class="wrap">
  <div class="top"><span>Il settimanale dei mercati</span>
    <label for="num">Numero <select id="num" aria-label="Scegli il numero"></select></label></div>
  <h1><b>F</b>inance <b>M</b>unchies</h1>
  <p class="sub">I giochi della settimana · punteggio automatico</p>
  <div class="dateline"><span id="dl-num">Numero —</span><span id="dl-date"></span></div>

  <div id="app"><p class="small" style="margin-top:20px">Caricamento dei giochi…</p></div>
</div>

<script>
(function(){
  "use strict";
  var app = document.getElementById('app');
  var sel = document.getElementById('num');
  var D = null, N = null;

  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  // percentuale con una cifra decimale e virgola (12,5%) — stessa regola del PDF
  function pc(a,b){ var x = Math.round(a*1000/b)/10; return String(x).replace('.', ',') + '%'; }
  function verdict(p){ return p>=90 ? 'Da gestore' : p>=70 ? 'Investitore preparato' : p>=50 ? 'Buone basi' : 'Si riparte dal glossario'; }
  function store(k, v){ try{ if(v===undefined) return JSON.parse(localStorage.getItem(k)||'null'); localStorage.setItem(k, JSON.stringify(v)); }catch(e){ return null; } }

  function load(n){
    fetch('giochi/n' + n + '.json').then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
      .then(function(d){ D = d; N = n; render(); })
      .catch(function(){ app.innerHTML = '<p class="err">Non riesco a caricare i giochi del numero ' + n + '. Riprova tra poco o scegli un altro numero.</p>'; });
  }

  function render(){
    document.getElementById('dl-num').textContent = 'Numero ' + D.numero;
    document.getElementById('dl-date').textContent = D.data;
    var saved = store('fm-giochi-' + N) || {};
    var h = '';
    // Gioco 1 — cruciverba
    var g = D.cruciverba.griglia, nums = {}, k = 0, r, c;
    for(r=0;r<g.length;r++) for(c=0;c<g[r].length;c++){
      if(g[r][c]==='.') continue;
      var sa = (c===0||g[r][c-1]==='.') && c+1<g[r].length && g[r][c+1]!=='.';
      var sd = (r===0||g[r-1][c]==='.') && r+1<g.length && g[r+1][c]!=='.';
      if(sa||sd) nums[r+'_'+c] = ++k;
    }
    h += '<section class="game"><div class="kicker">Gioco 1 · allenamento, non entra nel punteggio</div><h2>Il <span class="hl">cruciverba</span> della settimana</h2>';
    h += '<p class="note">Tocca una casella e scrivi: il cursore va avanti da solo. Tocca due volte la stessa casella per cambiare direzione.</p>';
    h += '<div class="cw-scroll"><table class="cw" id="cw">';
    for(r=0;r<g.length;r++){ h += '<tr>';
      for(c=0;c<g[r].length;c++){
        if(g[r][c]==='.'){ h += '<td></td>'; continue; }
        var id = 'c'+r+'_'+c, v = (saved.cw && saved.cw[id]) || '';
        h += '<td class="c">' + (nums[r+'_'+c] ? '<i>'+nums[r+'_'+c]+'</i>' : '') +
             '<input id="'+id+'" data-r="'+r+'" data-c="'+c+'" maxlength="1" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Riga '+(r+1)+' colonna '+(c+1)+'" value="'+esc(v)+'"></td>';
      }
      h += '</tr>'; }
    h += '</table></div><div class="defs"><div><h3>Orizzontali</h3>';
    D.cruciverba.orizzontali.forEach(function(x){ h += '<p><b>'+x[0]+'.</b> '+esc(x[2])+' <span class="len">('+x[1]+')</span></p>'; });
    h += '</div><div><h3>Verticali</h3>';
    D.cruciverba.verticali.forEach(function(x){ h += '<p><b>'+x[0]+'.</b> '+esc(x[2])+' <span class="len">('+x[1]+')</span></p>'; });
    h += '</div></div><div class="row"><button type="button" id="cw-check">Controlla il cruciverba</button><button type="button" id="cw-sol">Mostra la soluzione</button></div><div class="cwmsg" id="cw-msg"></div></section>';

    // Gioco 2 — quiz
    h += '<section class="game"><div class="kicker">Gioco 2</div><h2>Quiz: scegli la risposta</h2>';
    D.quiz.forEach(function(q){
      h += '<div class="q" id="q'+q.n+'"><p><b>'+q.n+'.</b> '+esc(q.text)+'</p><div class="opts">';
      q.opts.forEach(function(o,i){ var L='ABC'[i], id='q'+q.n+L, ck = saved['q'+q.n]===L ? ' checked' : '';
        h += '<span class="opt'+(L===q.ans?' right':'')+'"><input type="radio" name="q'+q.n+'" id="'+id+'" value="'+L+'"'+ck+'><label for="'+id+'"><span class="k">'+L+')</span>'+esc(o)+'</label></span>'; });
      h += '</div><div class="why"><b>Risposta '+q.ans+'.</b> '+esc(q.spiegazione)+'</div></div>';
    });
    h += '</section>';

    // Gioco 3 — vero o falso
    h += '<section class="game"><div class="kicker">Gioco 3</div><h2>Vero o falso?</h2><p class="note">Attenzione ai dettagli: un numero sbagliato rende falsa l\'intera frase.</p>';
    D.vf.forEach(function(v){
      h += '<div class="q" id="vf'+v.n+'"><p><b>'+v.n+'.</b> '+esc(v.text)+'</p><div class="opts">';
      [['V','Vero'],['F','Falso']].forEach(function(o){ var id='vf'+v.n+o[0], ck = saved['vf'+v.n]===o[0] ? ' checked' : '';
        h += '<span class="opt'+(o[0]===v.ans?' right':'')+'"><input type="radio" name="vf'+v.n+'" id="'+id+'" value="'+o[0]+'"'+ck+'><label for="'+id+'">'+o[1]+'</label></span>'; });
      h += '</div><div class="why"><b>'+(v.ans==='V'?'Vero':'Falso')+'.</b> '+esc(v.spiegazione)+'</div></div>';
    });
    h += '</section>';

    // Punteggio
    var nT = D.quiz.length + D.vf.length;
    h += '<section class="score" aria-live="polite"><div class="kicker">Il tuo punteggio</div><h2>Quanto ne sai, in percentuale</h2>' +
      '<p class="small" style="margin:0">Contano quiz e vero o falso: '+nT+' risposte, ognuna vale '+String(Math.round(10000/nT)/100).replace('.',',')+'%. Il cruciverba è un allenamento a parte.</p>' +
      '<div class="bars">' +
      '<div class="bar"><span>Quiz</span><div class="track"><div class="fill" id="f-q"></div></div><span class="v" id="v-q">—</span></div>' +
      '<div class="bar"><span>Vero/falso</span><div class="track"><div class="fill" id="f-v"></div></div><span class="v" id="v-v">—</span></div>' +
      '<div class="bar tot"><span><b>Totale</b></span><div class="track"><div class="fill" id="f-t"></div></div><span class="v" id="v-t">—</span></div></div>' +
      '<div class="verdict" id="verd"></div>' +
      '<div class="bands" id="bands"><span data-min="90">90–100% <b>Da gestore</b></span><span data-min="70">70–89% <b>Investitore preparato</b></span><span data-min="50">50–69% <b>Buone basi</b></span><span data-min="0">0–49% <b>Si riparte dal glossario</b></span></div>' +
      '<div class="row"><button type="button" class="primary" id="calc">Calcola il punteggio</button><button type="button" id="reset">Ricomincia</button></div>' +
      '<p class="small" id="miss"></p></section>';

    app.innerHTML = h;
    wire();
  }

  function answers(){
    var a = {}; document.querySelectorAll('input[type=radio]:checked').forEach(function(i){ a[i.name] = i.value; }); return a;
  }
  function save(){
    var s = answers(), cw = {};
    document.querySelectorAll('#cw input').forEach(function(i){ if(i.value) cw[i.id] = i.value; });
    s.cw = cw; store('fm-giochi-' + N, s);
  }

  // calcolo del punteggio: funzione pura, usata dal pulsante
  function score(d, a){
    var nq = 0, nv = 0;
    d.quiz.forEach(function(q){ if(a['q'+q.n]===q.ans) nq++; });
    d.vf.forEach(function(v){ if(a['vf'+v.n]===v.ans) nv++; });
    var tn = nq + nv, td = d.quiz.length + d.vf.length;
    return {nq:nq, dq:d.quiz.length, nv:nv, dv:d.vf.length, tn:tn, td:td, pt:tn*100/td};
  }

  function calc(){
    var a = answers(), s = score(D, a);
    function setBar(k, n, dd){ document.getElementById('f-'+k).style.width = (n*100/dd)+'%'; document.getElementById('v-'+k).textContent = n+'/'+dd+' = '+pc(n,dd); }
    setBar('q', s.nq, s.dq); setBar('v', s.nv, s.dv); setBar('t', s.tn, s.td);
    document.getElementById('verd').textContent = verdict(s.pt);
    var on = false; document.querySelectorAll('#bands span').forEach(function(b){ var hit = !on && s.pt >= +b.dataset.min; b.classList.toggle('on', hit); if(hit) on = true; });
    D.quiz.forEach(function(q){ mark('q'+q.n, a['q'+q.n], q.ans); });
    D.vf.forEach(function(v){ mark('vf'+v.n, a['vf'+v.n], v.ans); });
    var miss = s.td - Object.keys(a).length;
    document.getElementById('miss').textContent = miss > 0 ? (miss === 1 ? 'Una domanda senza risposta, contata come sbagliata.' : miss + ' domande senza risposta, contate come sbagliate.') : '';
  }
  function mark(id, given, right){ var el = document.getElementById(id); el.classList.add('show'); el.classList.toggle('ok', given===right); el.classList.toggle('ko', given!==right); }

  function wire(){
    // cruciverba: avanzamento automatico e cambio direzione
    var dir = 'A', g = D.cruciverba.griglia;
    function cell(r,c){ return document.getElementById('c'+r+'_'+c); }
    function hasA(r,c){ return (c>0&&g[r][c-1]!=='.')||(c+1<g[r].length&&g[r][c+1]!=='.'); }
    function hasD(r,c){ return (r>0&&g[r-1][c]!=='.')||(r+1<g.length&&g[r+1][c]!=='.'); }
    function hi(inp){
      document.querySelectorAll('#cw td.hiw').forEach(function(t){ t.classList.remove('hiw'); });
      var r=+inp.dataset.r, c=+inp.dataset.c, dr=dir==='A'?0:1, dc=dir==='A'?1:0, x;
      for(x=0; cell(r-dr*x,c-dc*x); x++) cell(r-dr*x,c-dc*x).parentNode.classList.add('hiw');
      for(x=1; cell(r+dr*x,c+dc*x); x++) cell(r+dr*x,c+dc*x).parentNode.classList.add('hiw');
    }
    var last = null;
    document.querySelectorAll('#cw input').forEach(function(inp){
      inp.addEventListener('focus', function(){ var r=+inp.dataset.r, c=+inp.dataset.c;
        if(dir==='A' && !hasA(r,c)) dir='D'; else if(dir==='D' && !hasD(r,c)) dir='A'; hi(inp); });
      inp.addEventListener('click', function(){ var r=+inp.dataset.r, c=+inp.dataset.c;
        if(last===inp && hasA(r,c) && hasD(r,c)){ dir = dir==='A'?'D':'A'; hi(inp); } last = inp; });
      inp.addEventListener('input', function(){
        inp.value = inp.value.replace(/[^a-zA-Z]/g,'').slice(-1).toUpperCase();
        inp.parentNode.classList.remove('good','bad');
        if(inp.value){ var r=+inp.dataset.r, c=+inp.dataset.c, n = dir==='A' ? cell(r,c+1) : cell(r+1,c); if(n){ last = n; n.focus(); n.select(); } }
        save();
      });
      inp.addEventListener('keydown', function(e){ var r=+inp.dataset.r, c=+inp.dataset.c, n=null;
        if(e.key==='Backspace' && !inp.value){ n = dir==='A' ? cell(r,c-1) : cell(r-1,c); if(n){ e.preventDefault(); n.value=''; n.focus(); save(); } return; }
        if(e.key==='ArrowRight') n=cell(r,c+1); if(e.key==='ArrowLeft') n=cell(r,c-1);
        if(e.key==='ArrowDown') n=cell(r+1,c); if(e.key==='ArrowUp') n=cell(r-1,c);
        if(n){ e.preventDefault(); dir = (e.key==='ArrowRight'||e.key==='ArrowLeft') ? 'A' : 'D'; n.focus(); }
      });
    });
    document.getElementById('cw-check').addEventListener('click', function(){
      var tot=0, ok=0, empty=0;
      document.querySelectorAll('#cw input').forEach(function(i){ tot++; var want = g[+i.dataset.r][+i.dataset.c];
        var td = i.parentNode; td.classList.remove('good','bad');
        if(!i.value){ empty++; return; } if(i.value===want){ ok++; td.classList.add('good'); } else td.classList.add('bad'); });
      document.getElementById('cw-msg').textContent = ok + ' lettere giuste su ' + tot + (empty ? ' · ' + empty + ' caselle ancora vuote' : '') + (ok===tot ? ' · Completato!' : '');
    });
    document.getElementById('cw-sol').addEventListener('click', function(){
      document.querySelectorAll('#cw input').forEach(function(i){ i.value = g[+i.dataset.r][+i.dataset.c]; i.parentNode.classList.remove('bad'); i.parentNode.classList.add('good'); });
      document.getElementById('cw-msg').textContent = 'Soluzione completa mostrata.'; save();
    });
    document.querySelectorAll('input[type=radio]').forEach(function(i){ i.addEventListener('change', function(){
      var q = i.closest('.q'); q.classList.remove('show','ok','ko'); save(); }); });
    document.getElementById('calc').addEventListener('click', calc);
    document.getElementById('reset').addEventListener('click', function(){ store('fm-giochi-' + N, {}); render(); window.scrollTo(0,0); });
  }

  function pick(n){ if(sel.value !== String(n)) sel.value = String(n); load(n); }
  fetch('giochi/index.json').then(function(r){ return r.json(); }).then(function(ix){
    var list = ix.numeri.slice().sort(function(a,b){ return b-a; });
    sel.innerHTML = list.map(function(n){ return '<option value="'+n+'">n. '+n+(ix.date && ix.date[n] ? ' · '+ix.date[n] : '')+'</option>'; }).join('');
    var m = /^#n(\d+)$/.exec(location.hash), want = m && list.indexOf(+m[1])>=0 ? +m[1] : list[0];
    pick(want);
    sel.addEventListener('change', function(){ location.hash = 'n' + sel.value; });
    window.addEventListener('hashchange', function(){ var m2 = /^#n(\d+)$/.exec(location.hash); if(m2 && list.indexOf(+m2[1])>=0) pick(+m2[1]); });
  }).catch(function(){ app.innerHTML = '<p class="err">Non riesco a caricare l\'elenco dei numeri. Riprova tra poco.</p>'; });
})();
</script>
</body>
</html>
